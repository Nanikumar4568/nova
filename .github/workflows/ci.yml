name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify index.html is self-contained and deterministic
        run: node scripts/smoke.mjs

      - name: Syntax-check the inline script
        run: |
          node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("index.html", "utf8");
            const m = html.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
            if (!m || !m[1].trim()) { console.error("no inline script found"); process.exit(1); }
            fs.writeFileSync("/tmp/nova.js", m[1]);
          '
          node --check /tmp/nova.js
          echo "inline script parses cleanly"
